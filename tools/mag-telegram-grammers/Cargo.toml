[package]
name = "mag-telegram-grammers"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
grammers-client = { path = "../../../grammers-mag/grammers-client" }
grammers-session = { path = "../../../grammers-mag/grammers-session", features = ["serde", "sqlite-storage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["rt", "time"] }
